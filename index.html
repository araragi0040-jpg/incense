<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2ea" />
  <title>香り日和｜お香 × コンディション記録 Mock v002 修正版2</title>
  <style>
:root {
  --bg: #f6f2ea;
  --paper: #fffdf9;
  --paper-2: #f1ece2;
  --paper-3: #ebe5d9;
  --line: #ddd4c7;
  --ink: #312a22;
  --muted: #7a7369;
  --green: #6e7e57;
  --green-deep: #59684a;
  --green-pale: #e7ecdf;
  --blue: #7184a2;
  --blue-pale: #e3e9f2;
  --purple: #9383a7;
  --purple-pale: #ebe6f1;
  --sand: #efe8dc;
  --shadow: 0 18px 40px rgba(64, 52, 37, .08);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 18px;
  --safe-top: max(14px, env(safe-area-inset-top));
  --safe-bottom: max(14px, env(safe-area-inset-bottom));
  --nav-height: 78px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  background:
    radial-gradient(circle at 0% 0%, rgba(190, 204, 173, .25), transparent 22%),
    radial-gradient(circle at 100% 10%, rgba(221, 204, 180, .23), transparent 22%),
    var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
body {
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.device-shell {
  width: min(100%, 430px);
  min-height: 100vh;
  min-height: 100dvh;
  background: rgba(246, 242, 234, .84);
  position: relative;
  /* backdrop-filter を親要素に付けると、環境によって fixed 要素の基準が
     画面ではなく .device-shell の末尾になるため使用しない */
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--safe-top) 18px 12px;
  border-bottom: 1px solid rgba(221, 212, 199, .78);
  background: rgba(246, 242, 234, .92);
  backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 10px; }
.smoke-mark {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  color: #b38c58;
  background: linear-gradient(145deg, #fffaf2, #efe6d7);
  border: 1px solid var(--line);
  font-size: 23px;
  transform: rotate(90deg);
}
.brand-title {
  font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
  font-size: 21px; font-weight: 700; letter-spacing: .08em;
}
.brand-sub {
  font-size: 11px; color: var(--muted); margin-top: 2px;
}
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--line); color: var(--green-deep);
  box-shadow: 0 4px 14px rgba(76,66,52,.06);
}

#app {
  padding: 18px 16px 24px;
  min-height: calc(100dvh - 82px);
}

.page-head {
  margin-bottom: 14px;
}
.page-head .eyebrow {
  color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .12em;
}
.page-head h1 {
  margin: 8px 0 0;
  font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
  font-size: 30px; line-height: 1.35;
}
.page-head p {
  margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.75;
}

.panel, .card {
  background: rgba(255,253,249,.96);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}
.panel { padding: 18px; }
.card { padding: 14px; }
.card + .card { margin-top: 10px; }
.card.soft { background: rgba(249,246,239,.92); box-shadow: none; }
.section { margin-top: 18px; }
.section-title {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.section-title h2 {
  margin: 0; font-size: 17px; font-weight: 800;
}
.section-title span {
  color: var(--muted); font-size: 12px;
}

.quick-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.metric-box {
  background: linear-gradient(145deg, rgba(255,255,255,.95), rgba(241,236,226,.95));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  min-height: 105px;
}
.metric-label { color: var(--muted); font-size: 12px; }
.metric-value { margin-top: 8px; font-size: 28px; font-weight: 800; }
.metric-note { margin-top: 5px; color: var(--green-deep); font-size: 12px; }

.btn {
  border: 0; border-radius: 16px; padding: 13px 16px; font-weight: 800;
}
.btn-primary { background: var(--green-deep); color: white; }
.btn-soft { background: var(--paper-2); color: var(--ink); border: 1px solid var(--line); }
.btn-outline { background: white; color: var(--green-deep); border: 1px solid var(--green); }
.btn.full { width: 100%; }
.btn-row { display: flex; gap: 10px; margin-top: 18px; }
.btn-row .btn { flex: 1; }
.small-btn { padding: 9px 12px; font-size: 12px; border-radius: 12px; }
.text-btn {
  border: 0; background: transparent; color: var(--green-deep); font-weight: 800; padding: 0; font-size: 12px;
}

.home-hero {
  position: relative;
  overflow: hidden;
  padding: 20px;
  background: linear-gradient(145deg, rgba(255,253,249,.95), rgba(238,233,222,.95));
}
.home-hero::after {
  content: "";
  position: absolute;
  right: -28px; top: -18px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(110, 126, 87, .10);
}
.home-hero .mini-flow {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px;
  color: var(--muted); font-size: 11px;
}
.home-hero .mini-flow b { color: var(--green-deep); }
.home-hero .mini-flow i { font-style: normal; color: #a18b66; }

.today-card {
  display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center;
}
.today-icon {
  width: 58px; height: 58px; border-radius: 18px;
  display: grid; place-items: center; font-size: 28px;
  background: var(--green-pale); color: var(--green-deep);
}
.today-title { margin: 0; font-size: 16px; font-weight: 800; }
.today-text { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }

.question-card { display: grid; grid-template-columns: 44px 1fr; gap: 12px; }
.question-badge {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(145deg, #f6f3ec, #eae3d7); border: 1px solid var(--line); font-size: 20px;
}
.question-card h3 { margin: 0 0 6px; font-size: 15px; }
.question-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  border: 1px solid var(--line); background: white; color: var(--ink);
  border-radius: 999px; padding: 9px 12px; font-size: 12px;
}
.chip.active { background: var(--green-deep); color: white; border-color: var(--green-deep); }

.product-list { display: grid; gap: 10px; }
.product-card {
  display: grid; grid-template-columns: 88px 1fr auto; gap: 12px; align-items: center;
  padding: 12px; border-radius: 20px; border: 1px solid var(--line); background: white;
}
.product-card.selected { outline: 2px solid rgba(89, 104, 74, .16); }
.product-visual {
  width: 88px; height: 88px; border-radius: 18px; position: relative; overflow: hidden;
  border: 1px solid rgba(0,0,0,.04);
}
.product-visual.kun {
  background: linear-gradient(180deg, #eef2e7 0%, #d2dbc5 58%, #b4c19f 100%);
}
.product-visual.chan {
  background: linear-gradient(180deg, #edf1f7 0%, #cbd8ea 55%, #94a8c2 100%);
}
.product-visual::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 72% 22%, rgba(255,255,255,.85) 0 10px, transparent 12px),
    linear-gradient(180deg, transparent 56%, rgba(255,255,255,.28) 57%, rgba(255,255,255,.08) 62%, transparent 65%);
}
.product-visual.kun::after {
  content: ""; position: absolute; left: 8px; right: 8px; bottom: 12px; height: 36px;
  background:
    radial-gradient(circle at 15% 100%, #7e8f68 0 18px, transparent 19px),
    radial-gradient(circle at 35% 100%, #6e8059 0 20px, transparent 21px),
    radial-gradient(circle at 55% 100%, #879973 0 17px, transparent 18px),
    radial-gradient(circle at 76% 100%, #6a7a57 0 19px, transparent 20px);
  filter: blur(.2px);
}
.product-visual.chan::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.34));
}
.product-meta h3 { margin: 0; font-size: 18px; }
.product-meta p { margin: 5px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.55; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; }
.tag.green { background: var(--green-pale); color: var(--green-deep); }
.tag.blue { background: var(--blue-pale); color: var(--blue); }
.selector {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid #d4ccb8; background: white; position: relative;
}
.selector.on::after {
  content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--green-deep);
}

.progress-wrap { margin-top: 10px; }
.progress-line {
  height: 8px; border-radius: 999px; overflow: hidden; background: #e8e2d7;
}
.progress-line > i {
  display: block; height: 100%; border-radius: inherit; background: var(--green);
}
.progress-label {
  display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--muted); font-size: 11px;
}

.record-panel { padding: 16px; }
.record-subtitle { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.65; }
.score-block + .score-block { margin-top: 16px; }
.score-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.score-head b { font-size: 14px; }
.score-head span { color: var(--muted); font-size: 11px; }
.icon-scale, .number-scale {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.scale-btn {
  border: 1px solid var(--line); background: white; border-radius: 999px; min-height: 44px;
  display: grid; place-items: center; color: var(--muted); font-weight: 700; font-size: 14px;
}
.icon-scale .scale-btn { min-height: 54px; font-size: 24px; }
.scale-btn.active { background: var(--green-deep); color: white; border-color: var(--green-deep); }
.scale-indices {
  display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 6px; text-align: center; color: var(--muted); font-size: 11px;
}

.step-labels {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px;
}
.step-box {
  padding: 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.72);
  font-size: 12px; color: var(--muted);
}
.step-box b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; }

.chart-card { padding: 16px; }
.line-chart {
  height: 150px; border: 1px solid var(--line); border-radius: 18px; padding: 12px; background: linear-gradient(180deg, white, #fcfaf5);
}
.line-chart svg { width: 100%; height: 100%; display: block; }
.chart-grid line { stroke: #e7e0d5; stroke-width: 1; }
.chart-axis text { fill: var(--muted); font-size: 11px; }
.chart-path { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart-dot { fill: var(--green); stroke: white; stroke-width: 2; }

.analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.donut-box, .affinity-box { min-height: 180px; }
.donut-wrap { display: grid; place-items: center; margin-top: 8px; }
.donut {
  width: 92px; height: 92px; border-radius: 50%;
  background: conic-gradient(var(--green) 0 58%, var(--blue) 58% 84%, var(--purple) 84% 100%);
  position: relative;
}
.donut::after {
  content: ""; position: absolute; inset: 18px; background: white; border-radius: 50%;
}
.legend { margin-top: 12px; display: grid; gap: 6px; font-size: 12px; }
.legend div { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.legend span { display: inline-flex; align-items: center; color: var(--muted); }

.affinity-graph {
  position: relative; height: 120px; margin-top: 16px;
}
.affinity-graph::before, .affinity-graph::after {
  content: ""; position: absolute; background: linear-gradient(180deg, transparent, #c8c1b3, transparent);
}
.affinity-graph::before { width: 2px; height: 56px; top: 26px; left: calc(50% - 1px); }
.affinity-graph::after { width: 70px; height: 2px; top: 79px; left: calc(50% - 35px); }
.node {
  position: absolute; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 800; color: white;
}
.node.k { background: var(--green); top: 4px; left: calc(50% - 23px); }
.node.c { background: var(--blue); bottom: 4px; left: calc(50% - 23px); }
.node.p { background: var(--purple); bottom: 4px; right: 10px; width: 42px; height: 42px; font-size: 16px; }
.node.s { background: #b8c2aa; bottom: 4px; left: 10px; width: 42px; height: 42px; font-size: 16px; }
.affinity-labels {
  display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); font-size: 11px;
}

.insight-box {
  background: linear-gradient(145deg, #f8f5ee, #ede7db);
  border-left: 4px solid var(--green);
}
.insight-box strong { display: block; font-size: 15px; margin-bottom: 6px; }
.insight-box p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.75; }

.timeline-list { display: grid; gap: 12px; }
.timeline-item { display: grid; grid-template-columns: 16px 1fr; gap: 10px; }
.timeline-mark {
  display: flex; flex-direction: column; align-items: center;
}
.timeline-mark i {
  width: 10px; height: 10px; border-radius: 50%; background: var(--green);
}
.timeline-mark::after {
  content: ""; width: 2px; flex: 1; background: #ded6c9; margin-top: 6px;
}
.timeline-item:last-child .timeline-mark::after { opacity: 0; }
.timeline-card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.timeline-date { color: var(--muted); font-size: 11px; }
.timeline-title { margin-top: 4px; font-size: 14px; font-weight: 800; }
.timeline-text { margin-top: 4px; color: var(--muted); font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 28px 14px; font-size: 13px; }

.purchase-top {
  background: linear-gradient(145deg, #eef2e8, #fcfaf5);
}
.purchase-item {
  display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center;
  padding: 10px 0; border-bottom: 1px dashed #ddd4c7;
}
.purchase-item:last-child { border-bottom: 0; }
.purchase-thumb {
  width: 72px; height: 72px; border-radius: 16px; overflow: hidden;
}
.purchase-meta h3 { margin: 0; font-size: 18px; }
.purchase-meta p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.stepper {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: white;
}
.stepper button {
  border: 0; background: transparent; color: var(--ink); font-size: 22px; width: 20px;
}
.stepper b { min-width: 18px; text-align: center; font-size: 20px; }
.summary-box {
  margin-top: 16px; padding-top: 16px; border-top: 1px dashed #d7cebf;
  display: flex; justify-content: space-between; align-items: center;
}
.summary-box .label { font-size: 14px; font-weight: 800; }
.summary-box .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
.summary-box .value { font-size: 30px; font-weight: 800; color: var(--green-deep); }

.flow-bar {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  overflow-x: auto;
  padding: 4px 2px 8px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.flow-bar::-webkit-scrollbar { display: none; }
.flow-step {
  flex: 0 0 88px;
  display: grid;
  gap: 8px;
  justify-items: center;
  text-align: center;
  scroll-snap-align: start;
}
.flow-icon {
  width: 52px; height: 52px; border-radius: 50%; background: white; border: 1px solid var(--line); display: grid; place-items: center; font-size: 24px;
}
.flow-text { font-size: 11px; color: var(--ink); line-height: 1.45; }
.flow-arrow {
  flex: 0 0 16px;
  align-self: flex-start;
  margin-top: 16px;
  color: #a18863;
  font-size: 18px;
  text-align: center;
}

.link-summary {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.link-summary b { font-size: 16px; }
.link-summary p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  width: min(100%, 430px);
  margin-inline: auto;
  min-height: var(--nav-height);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(255,253,249,.97);
  border-top: 1px solid rgba(221, 212, 199, .9);
  box-shadow: 0 -8px 24px rgba(54,45,34,.08);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  z-index: 1000;
  transform: translateZ(0);
}
.nav-item {
  min-width: 0;
  min-height: 52px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: var(--muted);
  display: grid;
  gap: 3px;
  place-items: center;
  align-content: center;
  font-size: 11px;
  padding: 5px 2px;
  cursor: pointer;
}
.nav-item:active { background: var(--paper-2); }
.nav-item.active {
  color: var(--green-deep);
  font-weight: 800;
  background: rgba(231,236,223,.62);
}
.nav-ico { font-size: 19px; line-height: 1; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-height) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(12px);
  background: rgba(49,42,34,.92); color: white; padding: 10px 14px; border-radius: 999px; font-size: 12px; opacity: 0; pointer-events: none; transition: .2s ease;
  z-index: 40;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(32,28,24,.36); display: grid; align-items: end; z-index: 50;
}
.modal-backdrop.hidden { display: none; }
.modal {
  background: var(--paper); border-radius: 24px 24px 0 0; padding: 14px 16px calc(14px + var(--safe-bottom)); box-shadow: 0 -10px 32px rgba(40,33,26,.12);
}
.modal-grip {
  width: 46px; height: 5px; border-radius: 999px; background: #d5cebf; margin: 0 auto 12px;
}
.modal h2 { margin: 0 0 14px; font-size: 18px; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }


button { cursor: pointer; }
button:focus-visible {
  outline: 3px solid rgba(89,104,74,.28);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.001ms !important; }
}

@media (max-width: 360px) {
  .product-card { grid-template-columns: 72px 1fr auto; }
  .product-visual { width: 72px; height: 72px; }
  .page-head h1 { font-size: 26px; }
  .summary-box .value { font-size: 26px; }
}

</style>
</head>
<body>
  <div class="device-shell">
    <header class="topbar">
      <div class="brand">
        <div class="smoke-mark">〰</div>
        <div>
          <div class="brand-title">香り日和</div>
          <div class="brand-sub">お香 × コンディション記録</div>
        </div>
      </div>
      <button type="button" class="icon-btn" id="resetBtn" aria-label="初期化" title="デモデータを初期化">↺</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button type="button" class="nav-item active" data-view="home"><span class="nav-ico">⌂</span><span>ホーム</span></button>
      <button type="button" class="nav-item" data-view="checkin"><span class="nav-ico">✎</span><span>記録</span></button>
      <button type="button" class="nav-item" data-view="report"><span class="nav-ico">▥</span><span>レポート</span></button>
      <button type="button" class="nav-item" data-view="purchase"><span class="nav-ico">👜</span><span>購入</span></button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal">
      <div class="modal-grip"></div>
      <h2>購入内容の確認</h2>
      <div id="modalBody"></div>
      <div class="modal-actions">

function computeRecommendation() {
  const { mood, energy, fatigue, focus } = state.checkin;
  let relaxScore = fatigue * 1.5 + (6 - energy) * 1.1 + (6 - mood) * 0.8;
  let focusScore = focus * 1.5 + energy * 0.8 + mood * 0.4;

  if (state.dailyAnswer === 'ゆっくり休みたい' || state.dailyAnswer === '気分を整えたい') relaxScore += 1.4;
  if (state.dailyAnswer === '集中したい' || state.dailyAnswer === '頭を切り替えたい') focusScore += 1.4;

  relaxScore += (100 - state.stock.kun) / 50;
  focusScore += (100 - state.stock.chan) / 50;

  state.recommendation = relaxScore >= focusScore ? 'kun' : 'chan';

  if (state.recommendation === 'kun') {
    state.qty.kun = Math.max(2, state.qty.kun);
    state.qty.chan = Math.max(1, state.qty.chan);
  } else {
    state.qty.chan = Math.max(2, state.qty.chan);
    state.qty.kun = Math.max(1, state.qty.kun);
  }
}

}

function lineChartSVG(records) {
  const width = 320;
  const height = 110;
  const left = 12;
  const bottom = 16;
  const top = 10;
  const right = 10;
  const innerW = width - left - right;
  const innerH = height - top - bottom;
  const stepX = innerW / Math.max(1, records.length - 1);

  const points = records.map((r, i) => {
    const x = left + stepX * i;
    const y = top + innerH * (1 - (r.mood - 1) / 4);
    return `${x},${y}`;
  }).join(' ');

  const yGrid = [1, 2, 3, 4, 5].map(level => {
    const y = top + innerH * (1 - (level - 1) / 4);
    return `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line><text x="0" y="${y + 4}">${level}</text>`;
  }).join('');

  const xLabels = records.map((r, i) => {
    const x = left + stepX * i;
    return `<text x="${x}" y="${height + 14}" text-anchor="middle">${r.date}</text>`;
  }).join('');

  const circles = records.map((r, i) => {
    const x = left + stepX * i;
    const y = top + innerH * (1 - (r.mood - 1) / 4);
    return `<circle class="chart-dot" cx="${x}" cy="${y}" r="4"></circle>`;
  }).join('');

  return `
    <svg viewBox="0 0 320 130" role="img" aria-label="今週の気分推移">
      <g class="chart-grid">${yGrid}</g>
      <polyline class="chart-path" points="${points}"></polyline>
      ${circles}
      <g class="chart-axis">${xLabels}</g>
    </svg>
  `;
}

      state.dailyAnswer = btn.dataset.daily;

      computeRecommendation();
      render();
      showToast('今日の一問を記録しました');

  document.querySelectorAll('[data-score-key]').forEach(btn => {

      state.checkin[btn.dataset.scoreKey] = Number(btn.dataset.score);
      saveState();
      render();

  });
  document.querySelectorAll('[data-product]').forEach(card => {
    card.onclick = () => {
      state.selectedProduct = card.dataset.product;
      saveState();
      render();
    };
  });
  document.querySelectorAll('[data-qty]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.qty;
      const delta = Number(btn.dataset.delta);
      state.qty[id] = Math.max(0, Math.min(9, state.qty[id] + delta));
      saveState();
      render();
    };
  });
  document.querySelectorAll('[data-action="save-checkin"]').forEach(btn => {
    btn.onclick = recordToday;
  });
  document.querySelectorAll('[data-action="purchase"]').forEach(btn => {
    btn.onclick = openPurchaseModal;
  });
}

function render() {
  computeRecommendation();
  const views = {
    home: renderHome,
    checkin: renderCheckin,
    report: renderReport,
    purchase: renderPurchase
  };
  app.innerHTML = (views[state.view] || renderHome)();
  updateNav();
  bindEvents();
}

resetBtn.addEventListener('click', () => {
  if (!confirm('デモデータを初期化しますか？')) return;
  state = defaultState();
  saveState();
  render();
  showToast('デモデータを初期化しました');
});

closeModalBtn.addEventListener('click', () => modalBackdrop.classList.add('hidden'));
modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) modalBackdrop.classList.add('hidden');
});
confirmPurchaseBtn.addEventListener('click', () => {
  modalBackdrop.classList.add('hidden');
  showToast('モック：ここから購入ページへ進みます');
});

render();

</script>
</body>
</html>
